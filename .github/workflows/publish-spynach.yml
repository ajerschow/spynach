# Publishes Spynach to PyPI as "spynach" with Trusted Publishing (no token): when a GitHub release tagged vX.Y.Z is
# published, build the distribution from that commit, test it, and upload it after the reviewer of the "pypi"
# environment approves. "Run workflow" (workflow_dispatch) builds and tests only. The release tag must equal the
# version in pyproject.toml. EasySpyn has its own workflow (publish-easyspyn.yml, tags easyspyn-vX.Y.Z).
#
# PyPI side (once): publisher of project spynach, owner ajerschow, repository spynach,
# workflow publish-spynach.yml, environment pypi.
name: publish-spynach

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # EasySpyn's releases (easyspyn-vX.Y.Z) must not start this workflow.
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'easyspyn-v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test,plot]" build twine
      - name: The release tag names the version being built
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "v$version" ]; then
            echo "release tag $tag does not match the package version v$version" >&2
            exit 1
          fi
      - name: Tests (the parity tests skip without the Spinach fixtures)
        run: python -m pytest -q tests/unit tests/easyspyn
        env:
          OPENBLAS_NUM_THREADS: "2"
      - name: Build
        run: python -m build --outdir dist/spynach
      - name: Check the metadata
        run: python -m twine check dist/spynach/*
      - name: The wheel holds spynach and ctps, not easyspyn
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/spynach/*.whl")[0]).namelist()
          tops = {n.split("/")[0] for n in names if "/" in n and not n.endswith(".dist-info/")}
          tops = {t for t in tops if not t.endswith(".dist-info")}
          assert tops == {"spynach", "ctps"}, tops
          assert any(n.startswith("spynach/grids/") and n.endswith(".npz") for n in names)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spynach-dist
          path: dist/spynach/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'easyspyn-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spynach-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
