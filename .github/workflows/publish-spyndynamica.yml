# Publishes SpynDynamica to PyPI as "spyndynamica" with Trusted Publishing (no token): when a GitHub release tagged
# spyndynamica-vX.Y.Z is published, build the distribution from that commit, test it, and upload it after the
# reviewer of the "pypi" environment approves. "Run workflow" (workflow_dispatch) builds and tests only.
#
# PyPI side (once): pending publisher for project spyndynamica, owner ajerschow, repository spynach,
# workflow publish-spyndynamica.yml, environment pypi.
name: publish-spyndynamica

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The releases of Spynach (vX.Y.Z) and of EasySpyn (easyspyn-vX.Y.Z) must not start this workflow.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'spyndynamica-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tools
        run: python -m pip install build twine pytest
      - name: The release tag names the version being built
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('packaging/spyndynamica/pyproject.toml','rb'))['project']['version'])")
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "spyndynamica-v$version" ]; then
            echo "release tag $tag does not match the package version spyndynamica-v$version" >&2
            exit 1
          fi
      - name: Build
        run: python scripts/build_spyndynamica.py
      - name: Check the metadata
        run: python -m twine check dist/spyndynamica/*
      - name: Install the wheel that was built
        run: python -m pip install dist/spyndynamica/*.whl
      - name: Tests against the installed package (the reference data are in the repository)
        run: python -m pytest -q tests/spyndynamica
        env:
          OPENBLAS_NUM_THREADS: "2"
      - uses: actions/upload-artifact@v4
        with:
          name: spyndynamica-dist
          path: dist/spyndynamica/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'spyndynamica-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spyndynamica-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
