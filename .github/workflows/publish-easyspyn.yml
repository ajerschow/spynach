# Publishes EasySpyn to PyPI as "easyspyn" with Trusted Publishing (no token): when a GitHub release tagged
# easyspyn-vX.Y.Z is published, build the distribution from that commit, test it, and upload it after the
# reviewer of the "pypi" environment approves. "Run workflow" (workflow_dispatch) builds and tests only.
#
# PyPI side (once): pending publisher for project easyspyn, owner ajerschow, repository spynach,
# workflow publish-easyspyn.yml, environment pypi.
name: publish-easyspyn

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Spynach's own releases (vX.Y.Z) must not start this workflow.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'easyspyn-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test,plot]" build twine
      - name: The release tag names the version being built
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('packaging/easyspyn/pyproject.toml','rb'))['project']['version'])")
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "easyspyn-v$version" ]; then
            echo "release tag $tag does not match the package version easyspyn-v$version" >&2
            exit 1
          fi
      - name: Tests (the parity tests skip without the fixtures)
        run: python -m pytest -q tests/easyspyn tests/unit/test_version.py
        env:
          OPENBLAS_NUM_THREADS: "2"
      - name: Build
        run: python scripts/build_easyspyn.py
      - name: Check the metadata
        run: python -m twine check dist/easyspyn/*
      - uses: actions/upload-artifact@v4
        with:
          name: easyspyn-dist
          path: dist/easyspyn/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'easyspyn-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easyspyn-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
