# The PyPI distribution "easyspyn": EPReasy, the Python port of EasySpin in this repository. Built from a staged
# copy of src/epreasy by scripts/build_easyspyn.py; the import name is epreasy.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easyspyn"
version = "0.2.0"  # keep equal to epreasy.__version__ and the repository version (tests/unit/test_version.py)
description = "EasySpin's EPR simulators in Python (EPReasy): cw EPR, ENDOR, slow motion, pulse EPR, fitting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alexej Jerschow"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]
keywords = ["EPR", "ESR", "EasySpin", "spectral simulation", "ENDOR", "spin dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
fast = ["numba>=0.60"]
# the parity helpers (epreasy.oracle) read EasySpin reference data through spynach
test = ["pytest>=8", "spynach", "h5py>=3.10"]

[project.urls]
Homepage = "https://ajerschow.github.io/spynach/easyspin.html"
Documentation = "https://github.com/ajerschow/spynach/blob/main/docs/epreasy.md"
Source = "https://github.com/ajerschow/spynach"
Changelog = "https://github.com/ajerschow/spynach/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["epreasy"]

[tool.setuptools.package-data]
epreasy = ["data/*.txt"]
