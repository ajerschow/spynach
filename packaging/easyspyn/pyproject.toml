# The PyPI distribution "easyspyn": EasySpyn, the Python port of EasySpin in this repository. Built from a staged
# copy of src/easyspyn by scripts/build_easyspyn.py.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easyspyn"
version = "0.3.1"  # keep equal to easyspyn.__version__ and the repository version (tests/unit/test_version.py)
description = "EasySpin's EPR simulators in Python (EasySpyn): cw EPR, ENDOR, slow motion, pulse EPR, fitting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alexej Jerschow"}]
requires-python = ">=3.11"
# Numba compiles the spectrum kernels; EASYSPYN_NUMBA=0, or an interpreter Numba does not support, uses NumPy instead
dependencies = ["numpy>=1.26", "scipy>=1.11", "numba>=0.60; platform_python_implementation == 'CPython'"]
keywords = ["EPR", "ESR", "EasySpin", "spectral simulation", "ENDOR", "spin dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
fast = []  # kept so that "easyspyn[fast]" still installs; Numba is a default dependency now
# the parity helpers (easyspyn.oracle) read EasySpin reference data through spynach
test = ["pytest>=8", "spynach", "h5py>=3.10"]

[project.urls]
Homepage = "https://ajerschow.github.io/spynach/easyspin.html"
Documentation = "https://github.com/ajerschow/spynach/blob/main/docs/easyspyn.md"
Source = "https://github.com/ajerschow/spynach"
Changelog = "https://github.com/ajerschow/spynach/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["easyspyn"]

[tool.setuptools.package-data]
easyspyn = ["data/*.txt"]
