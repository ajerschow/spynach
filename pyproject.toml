[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spynach"
version = "0.4.0"
description = "Python reimplementation of the Spinach spin dynamics kernel"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alexej Jerschow"}]
requires-python = ">=3.11"
# Numba is a default dependency: the sparse kernels (spynach) and the spectrum kernels (easyspyn) are compiled with it;
# without it (SPYNACH_NUMBA=0, EASYSPYN_NUMBA=0, an interpreter Numba does not support) NumPy and SciPy run instead.
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.10", "numba>=0.60; platform_python_implementation == 'CPython'"]

[project.optional-dependencies]
test = ["pytest>=8", "sympy>=1.12"]  # sympy: the relaxation pathway tests and guide
plot = ["plotly>=6"]
symbolic = ["sympy>=1.12"]  # relaxation pathways (spynach.pathways)
fast = []  # kept so that "spynach[fast]" still installs; Numba is a default dependency now
compare = ["spynach[plot]", "kaleido>=1.0", "matplotlib>=3.8"]
docs = ["spynach[plot]", "spynach[symbolic]", "kaleido>=1.0", "matplotlib>=3.8", "jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5.9"]
dev = ["spynach[test]", "spynach[symbolic]", "ruff>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spynach = ["grids/*.npz"]
easyspyn = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E741: Spinach's own matrix names (I, Q, l) are kept where the code mirrors a Spinach function.
# B905: zip() without strict= is the norm in this code; lengths are checked where they matter.
ignore = ["E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"comparison/report.py" = ["E501"]  # embedded CSS and HTML strings
