[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spynach"
version = "0.3.0"
description = "Python reimplementation of the Spinach spin dynamics kernel"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alexej Jerschow"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.10"]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["plotly>=6"]
fast = ["numba>=0.60"]
compare = ["spynach[plot]", "kaleido>=1.0", "matplotlib>=3.8"]
docs = ["spynach[plot]", "kaleido>=1.0", "matplotlib>=3.8", "jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5.9"]
dev = ["spynach[test]", "ruff>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spynach = ["grids/*.npz"]
epreasy = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E741: Spinach's own matrix names (I, Q, l) are kept where the code mirrors a Spinach function.
# B905: zip() without strict= is the norm in this code; lengths are checked where they matter.
ignore = ["E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"comparison/report.py" = ["E501"]  # embedded CSS and HTML strings
